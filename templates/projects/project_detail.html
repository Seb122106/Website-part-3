<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ project.project_name }} - SAO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .gold-text { background: linear-gradient(to right, #fad707, #f1ebc3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body style="background-color:#FAFAF9">

<header class="d-flex flex-wrap justify-content-center align-items-center py-3 ps-4 ps-md-5 mb-4 border-bottom" style="background-color:#1F2E6C">
    <a href="{% url 'home' %}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none">
        <span class="fs-4 fw-bold gold-text">SAO</span>
    </a>
    <ul class="nav nav-pills">
        <li class="nav-item"><a href="{% url 'home' %}" class="nav-link gold-text">Home</a></li>
        <li class="nav-item"><a href="{% url 'skillset' %}" class="nav-link gold-text">Skillset</a></li>
        <li class="nav-item"><a href="{% url 'about' %}" class="nav-link gold-text">About</a></li>
        <li class="nav-item"><a href="{% url 'contact' %}" class="nav-link gold-text">Let's Connect</a></li>
        <li class="nav-item"><a href="{% url 'project_list' %}" class="nav-link gold-text fw-bold">Catalog</a></li>
        <li class="nav-item"><a href="{% url 'testimony_list' %}" class="nav-link gold-text">Testimonies</a></li>
    </ul>
</header>

<div class="container py-5">
   <div class="row justify-content-center py-5">

    <div class="col-md-8">
        <a href="{% url 'project_list' %}" class="btn btn-sm mb-4 text-dark fw-bold" style="background: linear-gradient(to right, #fad707, #f1ebc3); border: 1px solid #0c0325; border-radius: 8px;">&larr; Back to Catalog</a>

        <h1 class="fw-bold text-body-emphasis display-3 mb-2" style="background: linear-gradient(to right, #1F2E6C, #0c0325); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">{{ project.project_name }}</h1>

        <p class="fs-5 text-body-emphasis fw-bold mb-4" style="color: #1F2E6C;">
            <span class="badge px-3 py-2" style="background: linear-gradient(to right, #0c0325, #1F2E6C); color: #fad707; border-radius: 8px;">Stack: {{ project.tech_stack_names }}</span>
        </p>

        <div class="card p-5 mb-4" style="background: #ffffff; border: 1px solid #0c0325; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
            <h3 class="fw-bold mb-3" style="color: #1F2E6C;">Project Description</h3>
            <p class="text-dark fs-5" style="line-height: 1.8;">{{ project.description }}</p>

            {% if project.link %}
                <div class="mt-4">
                    <a href="{{ project.link }}" target="_blank" rel="noopener noreferrer" class="btn btn-lg text-white border-0 px-4" style="background: linear-gradient(to right, #1F2E6C, #0c0325);">Launch Live Project</a>
                </div>
            {% endif %}
        </div>
    </div>

   </div>
</div>

</body>
</html>
