<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Tech Stack - SAO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .gold-text { background: linear-gradient(to right, #fad707, #f1ebc3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .navy-text { background: linear-gradient(to right, #1F2E6C, #0c0325); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-add { background: #1F2E6C; color: #fad707; border-radius: 12px; font-weight: bold; }
        .btn-add:hover { background: #0c0325; color: #f1ebc3; }
    </style>
</head>
<body style="background-color:#FAFAF9">

<header class="d-flex flex-wrap justify-content-center align-items-center py-3 ps-4 ps-md-5 mb-4 border-bottom" style="background-color:#1F2E6C">
    <a href="{% url 'dashboard_home' %}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none">
        <span class="fs-4 fw-bold gold-text">SAO Dashboard</span>
    </a>
    <ul class="nav nav-pills">
        <li class="nav-item"><a href="{% url 'dashboard_home' %}" class="nav-link gold-text">Projects</a></li>
        <li class="nav-item"><a href="{% url 'dashboard_tech_stacks' %}" class="nav-link gold-text fw-bold">Tech Stacks</a></li>
        <li class="nav-item"><a href="{% url 'home' %}" class="nav-link gold-text">View Portfolio</a></li>
        <li class="nav-item">
            <form method="post" action="{% url 'dashboard_logout' %}" class="m-0">
                {% csrf_token %}
                <button type="submit" class="nav-link gold-text">Sign Out</button>
            </form>
        </li>
    </ul>
</header>

<div class="container py-4">
    <div class="mx-auto" style="max-width: 600px;">
        <a href="{% url 'dashboard_tech_stacks' %}" class="btn btn-sm mb-4 text-dark fw-bold" style="background: linear-gradient(to right, #fad707, #f1ebc3); border: 1px solid #0c0325; border-radius: 8px;">&larr; Back to Tech Stacks</a>

        <h1 class="fw-bold display-6 mb-4 navy-text">Add Tech Stack</h1>

        <form method="post" novalidate class="card p-4" style="background: #ffffff; border: 1px solid #1F2E6C; border-radius: 16px;">
            {% csrf_token %}

            <div class="mb-3">
                <label for="{{ form.name.id_for_label }}" class="form-label fw-bold">Tech Stack Name</label>
                {{ form.name }}
                {% for error in form.name.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
            </div>

            <button type="submit" class="btn btn-add">Save Tech Stack</button>
        </form>
    </div>
</div>

</body>
</html>
