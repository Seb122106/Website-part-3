<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .gold-text { background: linear-gradient(to right, #fad707, #f1ebc3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .navy-text { background: linear-gradient(to right, #1F2E6C, #0c0325); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-add { background: #1F2E6C; color: #fad707; border-radius: 12px; font-weight: bold; }
        .btn-add:hover { background: #0c0325; color: #f1ebc3; }
    </style>
</head>
<body style="background-color:#FAFAF9">

<header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom" style="background-color:#1F2E6C">
    <a href="{% url 'home' %}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none">
        <span class="fs-4 fw-bold gold-text">SAO</span>
    </a>
    <ul class="nav nav-pills">
        <li class="nav-item"><a href="{% url 'home' %}" class="nav-link gold-text">Home</a></li>
        <li class="nav-item"><a href="{% url 'skillset' %}" class="nav-link gold-text">Skillset</a></li>
        <li class="nav-item"><a href="{% url 'about' %}" class="nav-link gold-text">About</a></li>
        <li class="nav-item"><a href="{% url 'contact' %}" class="nav-link gold-text">Let's Connect</a></li>
        <li class="nav-item"><a href="{% url 'project_list' %}" class="nav-link gold-text">Catalog</a></li>
        <li class="nav-item"><a href="{% url 'testimony_list' %}" class="nav-link gold-text fw-bold">Testimonies</a></li>
    </ul>
</header>

<div class="container py-4">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold display-6 mb-0 navy-text">Testimonies</h1>
    <a href="{% url 'testimony_create' %}" class="btn btn-add">+ Leave a Testimony</a>
</div>

<div class="row row-cols-1 row-cols-md-3 g-3">
    {% for t in testimonies %}
    <div class="col">
        <div class="card p-4 h-100" style="background: #ffffff; border: 1px solid #1F2E6C; border-radius: 16px;">
            <p class="mb-3">{{ t.content|truncatechars:120 }}</p>
            <p class="fw-bold mb-2" style="color: #1F2E6C;">{{ t.full_name }}</p>
            <a href="{% url 'testimony_detail' pk=t.pk %}" style="color: #1F2E6C;">Read more &rarr;</a>
        </div>
    </div>
    {% empty %}
    <div class="col"><p class="text-muted">No testimonies yet.</p></div>
    {% endfor %}
</div>





    
    </div>

</body>
</html>
