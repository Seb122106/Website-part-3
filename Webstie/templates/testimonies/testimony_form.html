{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Testimony - SAO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-container input, .form-container textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #1F2E6C;
            background-color: #ffffff;
            color: #0A1130;
            font-size: 0.95rem;
            outline: none;
        }
        .form-container textarea {
            min-height: 120px;
        }
    </style>
</head>
<body style="background-color: #ffffff; color: white;">

    <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom border-secondary" style="background-color: #1F2E6C;"> 
        <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none ms-4"> 
            <span class="fs-4 fw-bold" style="background: linear-gradient(to right, #fad707, #f1ebc3); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">SAO</span> 
        </a> 

        <ul class="nav nav-pills me-4"> 
            <li class="nav-item"><a href="/" class="nav-link" style="background: linear-gradient(to right, #fad707, #f1ebc3); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Home</a></li>
            <li class="nav-item"><a href="/skillset" class="nav-link" style="background: linear-gradient(to right, #fad707, #f1ebc3); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Skillset</a></li> 
            <li class="nav-item"><a href="/about" class="nav-link" style="background: linear-gradient(to right, #fad707, #f1ebc3); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">About</a></li>
            <li class="nav-item"><a href="/contact" class="nav-link" style="background: linear-gradient(to right, #fad707, #f1ebc3); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Let's Connect</a></li>
            <li class="nav-item"><a href="{% url 'project_list' %}" class="nav-link" style="background: linear-gradient(to right, #fad707, #f1ebc3); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Catalog</a></li>
            <li class="nav-item"><a href="{% url 'testimony_list' %}" class="nav-link fw-bold" style="background: linear-gradient(to right, #fad707, #f1ebc3); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Testimonies</a></li>
        </ul>
    </header>

    <h1 style="background: linear-gradient(to right, #fad707, #f1ebc3); -webkit-background-clip: text; -webkit-text-fill-color: transparent;" class="d-flex justify-content-center fw-bold mb-4">LEAVE A TESTIMONY</h1>

    <div class="container d-flex justify-content-center">
        <div class="w-100" style="max-width: 650px;">
            <div class="p-4 rounded-4 shadow form-container" style="border: 2px solid #0c0325; background: linear-gradient(135deg, #fad707, #f1ebc3); color: #1F2E6C;">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="font-monospace d-block text-uppercase fw-bold mb-1" style="font-size: 0.75rem; color: #1F2E6C;">Your Name</label>
                        {{ form.author_name }}
                    </div>
                    <div class="mb-3">
                        <label class="font-monospace d-block text-uppercase fw-bold mb-1" style="font-size: 0.75rem; color: #1F2E6C;">Testimony Content</label>
                        {{ form.content }}
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <button type="submit" class="btn fw-bold px-4 py-2" style="background-color: #1F2E6C; color: #fad707; border: none;">Submit</button>
                        <a href="{% url 'testimony_list' %}" class="text-decoration-none fw-bold" style="color: #1F2E6C;">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
