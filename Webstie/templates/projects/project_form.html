<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Project - SAO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .gold-text { background: linear-gradient(to right, #fad707, #f1ebc3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .navy-text { background: linear-gradient(to right, #1F2E6C, #0c0325); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-add { background: #1F2E6C; color: #fad707; border-radius: 12px; font-weight: bold; }
        .btn-add:hover { background: #0c0325; color: #f1ebc3; }
    </style>
</head>
<body style="background-color:#FAFAF9">

<header class="d-flex flex-wrap justify-content-center align-items-center py-3 ps-4 ps-md-5 mb-4 border-bottom" style="background-color:#1F2E6C">
    <a href="{% url 'home' %}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none">
        <span class="fs-4 fw-bold gold-text">SAO</span>
    </a>
    <ul class="nav nav-pills">
        <li class="nav-item"><a href="{% url 'home' %}" class="nav-link gold-text">Home</a></li>
        <li class="nav-item"><a href="{% url 'skillset' %}" class="nav-link gold-text">Skillset</a></li>
        <li class="nav-item"><a href="{% url 'about' %}" class="nav-link gold-text">About</a></li>
        <li class="nav-item"><a href="{% url 'contact' %}" class="nav-link gold-text">Let's Connect</a></li>
        <li class="nav-item"><a href="{% url 'project_list' %}" class="nav-link gold-text fw-bold">Catalog</a></li>
        <li class="nav-item"><a href="{% url 'testimony_list' %}" class="nav-link gold-text">Testimonies</a></li>
    </ul>
</header>

<div class="container py-4">
    <div class="mx-auto" style="max-width: 560px;">
        <a href="{% url 'project_list' %}" class="btn btn-sm mb-4 text-dark fw-bold" style="background: linear-gradient(to right, #fad707, #f1ebc3); border: 1px solid #0c0325; border-radius: 8px;">&larr; Back to Catalog</a>

        <h1 class="fw-bold display-6 mb-4 navy-text">Add Project</h1>

        <form method="post" class="card p-4" style="background: #ffffff; border: 1px solid #1F2E6C; border-radius: 16px;">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label fw-bold">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                <div class="text-danger small">{{ error }}</div>
                {% endfor %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-add">Save Project</button>
        </form>
    </div>
</div>

</body>
</html>
