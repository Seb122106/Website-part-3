<!DOCTYPE html>
<html>
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color:#FAFAF9">
    <header class=" d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom" style="background-color:#1F2E6C"> 
    
    <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none"> 
        <svg class="bi me-2" width="40" height="32" aria-hidden="true">
            <use xlink:href="#bootstrap"></use>
        </svg> 
        <span class="fs-4 fw-bold" style="background: linear-gradient(to right, #fad707, #f1ebc3); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">SAO</span> 
    </a> 

    <ul class="nav nav-pills"> 
        <a href="/" class="nav-link" style="background: linear-gradient(to right, #fad707, #f1ebc3); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Home</a>
        <li class="nav-item" style="background: linear-gradient(to right, #fad707, #f1ebc3); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"><a href="/skillset" class="nav-link">Skillset</a></li> 
        <li class="nav-item" style="background: linear-gradient(to right, #fad707, #f1ebc3); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"><a href="/about" class="nav-link">About</a></li>
        <li class="nav-item" style="background: linear-gradient(to right, #fad707, #f1ebc3); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"><a href="/contact" class="nav-link">Let's Connect</a></li>
        <li class="nav-item" style="background: linear-gradient(to right, #fad707, #f1ebc3); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
    <a href="{% url 'project_list' %}" class="nav-link fw-bold">Catalog</a>
    </ul> 
</header> 
<div class="container py-5">
   <div class="row justify-content-center py-5"> 
    
    <div class="col-md-8">
        <a href="{% url 'project_list' %}" class="btn btn-sm mb-4 text-dark fw-bold" style="background: linear-gradient(to right, #fad707, #f1ebc3); border: 1px solid #0c0325; border-radius: 8px;">&larr; Back to Catalog</a>
        
        <h1 class="fw-bold text-body-emphasis display-3 mb-2" style="background: linear-gradient(to right, #1F2E6C, #0c0325); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">{{ project.project_name }}</h1>
        
        <p class="fs-5 text-body-emphasis fw-bold mb-4" style="color: #1F2E6C;">
            <span class="badge px-3 py-2" style="background: linear-gradient(to right, #0c0325, #1F2E6C); color: #fad707; border-radius: 8px;">Stack: {{ project.tech_stack }}</span>
        </p> 

        <div class="card p-5 mb-4" style="background: #ffffff; border: 1px solid #0c0325; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
            <h3 class="fw-bold mb-3" style="color: #1F2E6C;">Project Description</h3>
            <p class="text-dark fs-5" style="line-height: 1.8;">{{ project.description }}</p>
            
            {% if project.link %}
                <div class="mt-4">
                    <a href="{{ project.link }}" target="_blank" class="btn btn-lg text-white border-0 px-4" style="background: linear-gradient(to right, #1F2E6C, #0c0325);">Launch Live Project</a>
                </div>
            {% endif %}
        </div>
    </div> 

   </div> 
</div>
</body>
</html>
